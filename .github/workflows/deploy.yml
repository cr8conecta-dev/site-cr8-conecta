name: Publicar no cr8conecta.com.br

# Publica o site na Hostinger por FTP a cada push na branch main.
# Segurança: usa um arquivo de estado PRÓPRIO (não toca no .ftp-deploy-sync-state.json antigo)
# e NUNCA apaga o que ele não enviou, então as outras ferramentas (crm, link, marketing etc.) ficam intactas.
# Para testar sem mudar nada no servidor: Actions > Publicar > Run workflow > dry_run = true.

on:
  # push automático DESLIGADO por enquanto (primeiro só teste manual).
  # Para ligar depois da aprovação, descomente as 2 linhas abaixo:
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só simular (não envia nada)"
        type: boolean
        default: true

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar as páginas
        run: python3 _fonte/gerar.py

      - name: Enviar para a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: public_html/
          state-name: .ftp-deploy-cr8-site-novo.json
          dangerous-clean-slate: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            _fonte/**
            **/*.md
            .htaccess
            .gitignore
            referencias/**
            **/__pycache__/**
            **/.ftp-deploy*
